[package]
name = "astral-dev"
version = "0.1.0-dev"
description = "Environnement de dev local pour projets Astral PHP"
edition = "2021"

[lib]
name = "astral_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2.1"
getrandom = "0.4.3"
notify = "8"
